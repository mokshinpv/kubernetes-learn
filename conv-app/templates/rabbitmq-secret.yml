apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.rabbitmq.name }}-secret
type: Opaque
data:
  AMQP_EXCHANGE: {{ .Values.rabbitmq.secret.exchange | b64enc }}
  AMQP_USER: {{ .Values.rabbitmq.secret.user | b64enc }}
  AMQP_PASSWORD: {{ .Values.rabbitmq.secret.password | b64enc }}
  AMQP_HOSTNAME: {{ printf "%s-service" .Values.rabbitmq.name | b64enc }}
  AMQP_QUEUE: {{ .Values.rabbitmq.secret.queue | b64enc }}
