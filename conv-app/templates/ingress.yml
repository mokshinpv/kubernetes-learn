apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.app.name }}-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.app.domain }}
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: {{ .Values.app.name }}-service
                port:
                  number: {{ .Values.app.port }}
          - pathType: Prefix
            path: "/api"
            backend:
              service:
                name: {{ .Values.api.name }}-service
                port:
                  number: {{ .Values.api.port }}
          - pathType: Prefix
            path: "/uploads"
            backend:
              service:
                name: {{ .Values.api.name }}-service
                port:
                  number: {{ .Values.api.port }}
