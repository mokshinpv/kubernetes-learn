apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.rabbitmq.name }}-service
spec:
  type: ClusterIP
  selector:
    component: {{ .Values.rabbitmq.component }}
  ports:
    - name: rabbitmq
      port: {{ .Values.rabbitmq.port }}
      protocol: TCP
    - name: management
      port: {{ .Values.rabbitmq.managementPort }}
      protocol: TCP
